; PlatformIO config for the Waveshare Internet Radio.
;
; Usage:
;   pio run                   build
;   pio run -t upload         flash over USB-UART
;   pio device monitor        open serial CLI at 9600 8N1
;
; The Arduino sketch lives in winRadio/; src_dir points there so PIO picks
; up winRadio.ino, cli.ino, and es8311.cpp and runs the Arduino auto-
; prototype pass on the .ino files.

[platformio]
src_dir = winRadio
default_envs = waveshare-s3-radio

[env:waveshare-s3-radio]
; pioarduino ships arduino-esp32 v3.x / ESP-IDF 5.x / GCC 13, which is needed
; because ESP32-audioI2S now uses <span> and other C++20 headers. The stock
; espressif32 platform is stuck on arduino-esp32 v2.x (GCC 8) and fails to
; find <span>.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 9600
upload_speed = 921600
upload_port = COM5
monitor_port= COM5

; Waveshare ESP32-S3 module: 16 MB flash, 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The Waveshare ESP32-S3 dev board exposes a single USB-C port wired to the
; chip's native USB-Serial/JTAG. CDC_ON_BOOT=1 routes `Serial` to that port
; so PuTTY / the PlatformIO monitor use the same COM port that esptool
; flashes over. Baud rate is virtualised on USB CDC (the `9600` passed to
; Serial.begin is ignored); PuTTY's baud setting is likewise cosmetic.
; CORE_DEBUG_LEVEL is an Arduino-IDE option (Tools > Core Debug Level) that
; isn't set by default under PlatformIO; ESP32-audioI2S uses it, so define
; it here. 0=none, 3=info, 5=verbose.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git
    https://github.com/moononournation/Arduino_GFX.git
    lovyan03/LovyanGFX @ ^1.1.16
